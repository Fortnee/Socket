name: Keep Render Alive
on:
  schedule:
    - cron: '*/5 * * * *' # A cada 5 minutos
  workflow_dispatch: # Permite correr manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GameArena Backend
        run: |
          echo "A acordar o Render..."
          curl -fsS --max-time 60 --retry 3 https://gamer-fortune.onrender.com/api/health
